# Backend Nginx Reverse Proxy Config
# Đây là suggested config nếu muốn add Nginx layer trước Express backend
# để properly forward X-Forwarded-For headers

server {
    listen 80;
    server_name _;

    # Client body size limit
    client_max_body_size 50M;

    location /api {
        proxy_pass http://backend:3000;
        
        # QUAN TRỌNG: Forward headers để Express nhận đúng client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        # Điều chỉnh proxy timeout nếu cần
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Preserve cookies
        proxy_cookie_path / /;
    }

    # Serve uploads từ backend
    location /uploads {
        proxy_pass http://backend:3000/uploads;
    }
}
