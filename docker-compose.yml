services:
  redis:
    image: redis:7-alpine
    container_name: calendar-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:3000"
    env_file:
      - ./be/.env
    volumes:
      - ./be/uploads:/usr/src/app/uploads
    depends_on:
      - redis

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT}:80"
    depends_on:
      - frontend

volumes:
  db_data:
  redis_data: