services:
  redis:
    image: redis:7-alpine
    container_name: calendar-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - calendar-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    # ⚠️ CHANGED: Backend không expose port trực tiếp nữa
    # Requests phải đi qua backend-nginx proxy để lấy đúng client IP
    # ports:
    #   - "${BACKEND_PORT}:3000"
    expose:
      - "3000"
    env_file:
      - ./be/.env.docker
    volumes:
      - ./be/uploads:/usr/src/app/uploads
    depends_on:
      - redis
    networks:
      - calendar-network

  # ✅ NEW: Nginx reverse proxy - forward X-Forwarded-For headers
  backend-nginx:
    image: nginx:alpine
    container_name: calendar-backend-nginx
    restart: always
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./be/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - calendar-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend-nginx
    networks:
      - calendar-network

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT}:80"
    depends_on:
      - frontend
    networks:
      - calendar-network

volumes:
  db_data:
  redis_data:

networks:
  calendar-network:
    driver: bridge