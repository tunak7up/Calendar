name: calendar

services:
  redis:
    image: redis:7-alpine
    container_name: calendar-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --protected-mode no
    volumes:
      - redis_data:/data
    networks:
      - febe-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:3000"
    env_file:
      - ./be/.env.docker
    volumes:
      - ./be/uploads:/usr/src/app/uploads
    depends_on:
      - redis
    networks:
      - febe-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - ./fe/.env.production
    depends_on:
      - backend
    networks:
      - febe-network

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT}:80"
    depends_on:
      - frontend
    networks:
      - febe-network

volumes:
  db_data:
  redis_data:

networks:
  febe-network:
    name: febe-network
    driver: bridge
