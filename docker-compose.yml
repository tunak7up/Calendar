version: '3.8'

services:
  backend:
    build:
      context: ./be
    ports:
      - "3000:3000"
    env_file:
      - ./be/.env
    volumes:
      - ./be:/usr/src/app
    depends_on:
      - database

  frontend:
    build:
      context: ./fe
    ports:
      - "8080:80"
    volumes:
      - ./fe:/usr/share/nginx/html
    depends_on:
      - backend

  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong!Password"
      ACCEPT_EULA: "Y"
    volumes:
      - db_data:/var/opt/mssql

volumes:
  db_data: