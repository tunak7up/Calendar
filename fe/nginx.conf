server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Không bao giờ cache file index.html (để luôn lấy bản mới nhất mỗi khi mở lại tab/trình duyệt)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        if_modified_since off;
        expires off;
        etag off;
    }

    # 2. Cache vĩnh viễn (1 năm) các file tĩnh trong thư mục /assets/ do Vite tạo ra 
    # (vì Vite tự động thêm mã hash ngẫu nhiên vào tên file mỗi khi build, vd: index-abc123.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
